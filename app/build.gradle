plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.primegame.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.primegame.assistant'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildFeatures { viewBinding false }
    kotlinOptions { jvmTarget = '17' }
}
